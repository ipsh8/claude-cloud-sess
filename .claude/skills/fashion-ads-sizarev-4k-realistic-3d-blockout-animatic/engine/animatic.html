<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Blockout Animatic Engine</title>
<style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<script type="module">
// SIZAREV-style blockout animatic engine — "Made in Claude, not Blender".
// Renders blocky low-poly characters on a seamless studio cyc with a motion-control camera,
// driven entirely by a JSON shot spec (window.SPEC or ?spec=<url>). Deterministic: frame t is
// rendered on demand via window.__render(t) so render.mjs can capture every frame.
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
let SPEC = window.SPEC;
if (!SPEC && params.get('spec')) SPEC = await (await fetch(params.get('spec'))).json();
if (!SPEC) throw new Error('No SPEC provided');

const W = SPEC.width || 1280, H = SPEC.height || 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const studio = Object.assign({ floor: '#cfccc6', wall: '#8e8a84', fogNear: 9, fogFar: 26, key: 'left' }, SPEC.studio || {});
scene.background = new THREE.Color(studio.wall);
scene.fog = new THREE.Fog(studio.wall, studio.fogNear, studio.fogFar);

// Seamless cyclorama: floor + curved cove + back wall as one swept profile.
{
  const shape = [];
  const R = 4, depth = 14;
  for (let i = 0; i <= 24; i++) { const a = (i / 24) * Math.PI / 2; shape.push(new THREE.Vector2(depth - R + Math.sin(a) * R, R - Math.cos(a) * R)); }
  shape.unshift(new THREE.Vector2(-30, 0)); shape.push(new THREE.Vector2(depth, 20));
  const pts = shape.map(p => new THREE.Vector3(0, p.y, -p.x));
  const geo = new THREE.BufferGeometry();
  const verts = [], idx = [];
  const halfW = 40;
  pts.forEach(p => { verts.push(-halfW, p.y, p.z, halfW, p.y, p.z); });
  for (let i = 0; i < pts.length - 1; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3)); geo.setIndex(idx); geo.computeVertexNormals();
  const cyc = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: studio.floor, roughness: 0.95, side: THREE.DoubleSide }));
  cyc.receiveShadow = true; scene.add(cyc);
}
scene.add(new THREE.HemisphereLight('#ffffff', '#6d6a66', 1.15));
const key = new THREE.DirectionalLight('#fff6ec', 2.2);
key.position.set(studio.key === 'left' ? -6 : 6, 9, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03;
Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 40 });
scene.add(key);
const fill = new THREE.DirectionalLight('#e9eef7', 0.6); fill.position.set(studio.key === 'left' ? 6 : -6, 4, 4); scene.add(fill);

// ---------- helpers ----------
const mats = {};
const mat = c => mats[c] ||= new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 });
function box(w, h, d, color, parent, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function pivot(parent, x, y, z) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }
const ease = {
  linear: t => t,
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutQuint: t => t < .5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2, // bolt-cam snap
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
};
const lerp = (a, b, t) => a + (b - a) * t;
const lerpArr = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
function sample(kfs, t, fields) {
  // keyframes [{t, ...fields, ease, cut}] → interpolated object
  if (t <= kfs[0].t) return { ...kfs[0] };
  for (let i = 0; i < kfs.length - 1; i++) {
    const a = kfs[i], b = kfs[i + 1];
    if (t >= a.t && t < b.t) {
      if (b.cut) return { ...a };
      const u = (ease[b.ease || 'inOutCubic'])((t - a.t) / (b.t - a.t));
      const o = { ...b };
      for (const f of fields) if (a[f] !== undefined && b[f] !== undefined) o[f] = Array.isArray(a[f]) ? lerpArr(a[f], b[f], u) : (typeof a[f] === 'number' ? lerp(a[f], b[f], u) : b[f]);
      o._u = u; o._a = a; return o;
    }
  }
  return { ...kfs[kfs.length - 1] };
}

// ---------- blocky character ----------
function makeCharacter(c) {
  const k = Object.assign({ skin: '#f0d6c4', hair: '#2b2b2e', top: '#1d1d20', bottom: '#1a1a1c', shoes: '#9a8f80', shirt: '#f4f4f2', height: 1.0 }, c.look || {});
  const root = new THREE.Group(); scene.add(root);
  const body = pivot(root, 0, 0, 0); body.scale.setScalar(k.height);
  const hips = pivot(body, 0, 0.95, 0);
  const torso = box(0.46, 0.62, 0.26, k.top, hips, 0, 0.33, 0);
  if (k.collar !== false) box(0.2, 0.05, 0.04, k.shirt, hips, 0, 0.62, 0.135);
  const neck = box(0.1, 0.1, 0.1, k.skin, hips, 0, 0.69, 0);
  const headP = pivot(hips, 0, 0.74, 0);
  const head = box(0.3, 0.34, 0.3, k.skin, headP, 0, 0.17, 0);
  if (k.hairStyle !== 'none') {
    box(0.34, 0.12, 0.34, k.hair, headP, 0, 0.36, 0);          // crown
    box(0.06, 0.3, 0.34, k.hair, headP, -0.17, 0.2, 0);         // sides (bob)
    box(0.06, 0.3, 0.34, k.hair, headP, 0.17, 0.2, 0);
    box(0.34, 0.3, 0.06, k.hair, headP, 0, 0.2, -0.17);         // back
    if (k.fringe !== false) box(0.34, 0.08, 0.05, k.hair, headP, 0, 0.29, 0.16);
  }
  if (k.hat) box(0.34, 0.1, 0.34, k.hat, headP, 0, 0.38, 0);
  if (k.glasses) { box(0.11, 0.06, 0.03, k.glasses, headP, -0.07, 0.19, 0.16); box(0.11, 0.06, 0.03, k.glasses, headP, 0.07, 0.19, 0.16); }
  const arm = side => {
    const sh = pivot(hips, side * 0.29, 0.6, 0);
    box(0.12, 0.34, 0.14, k.top, sh, 0, -0.17, 0);
    const el = pivot(sh, 0, -0.34, 0);
    box(0.11, 0.3, 0.12, k.top, el, 0, -0.15, 0);
    if (k.cuffs !== false) box(0.115, 0.05, 0.125, k.shirt, el, 0, -0.31, 0);
    const hand = box(0.09, 0.09, 0.09, k.skin, el, 0, -0.37, 0);
    return { sh, el, hand };
  };
  const L = arm(-1), R = arm(1);
  const leg = side => {
    const hp = pivot(hips, side * 0.12, 0, 0);
    box(0.19, 0.48, 0.2, k.bottom, hp, 0, -0.24, 0);
    const kn = pivot(hp, 0, -0.48, 0);
    box(0.18, 0.44, 0.19, k.bottom, kn, 0, -0.22, 0);
    box(0.16, 0.06, 0.28, k.shoes, kn, 0, -0.46, 0.05);
    return { hp, kn };
  };
  const LL = leg(-1), RL = leg(1);
  // bag in a hand
  let bag = null;
  if (c.bag) {
    const handG = c.bag.hand === 'left' ? L : R;
    bag = pivot(handG.el, 0, -0.42, 0);
    const b = Object.assign({ w: 0.36, h: 0.3, d: 0.12, color: '#2a2a2c' }, c.bag);
    box(0.03, 0.12, 0.03, b.handle || '#111', bag, -0.06, -0.04, 0);
    box(0.03, 0.12, 0.03, b.handle || '#111', bag, 0.06, -0.04, 0);
    box(b.w, b.h, b.d, b.color, bag, 0, -0.1 - b.h / 2, 0);
  }
  return { id: c.id, root, hips, headP, L, R, LL, RL, bag, spec: c, anchors: { head: headP, handL: L.el, handR: R.el, hips } };
}

function poseCharacter(ch, t) {
  const kfs = ch.spec.path || [{ t: 0, pos: [0, 0], face: 0 }];
  const s = sample(kfs, t, ['pos', 'face', 'headYaw', 'headPitch']);
  ch.root.position.set(s.pos[0], 0, s.pos[1]);
  ch.root.rotation.y = THREE.MathUtils.degToRad(s.face || 0);
  // distance travelled → walk phase (stride ~1.3m per full cycle)
  const dt = 1 / 60; const prev = sample(kfs, Math.max(0, t - dt), ['pos']);
  const speed = Math.hypot(s.pos[0] - prev.pos[0], s.pos[1] - prev.pos[1]) / dt;
  let dist = 0; for (let x = 0; x < t; x += 1 / 48) { const a = sample(kfs, x, ['pos']).pos, b = sample(kfs, Math.min(t, x + 1 / 48), ['pos']).pos; dist += Math.hypot(b[0] - a[0], b[1] - a[1]); }
  const walking = Math.min(1, speed / 0.6);
  const ph = (dist / 1.3) * Math.PI * 2;
  const sw = 0.55 * walking;
  ch.LL.hp.rotation.x = Math.sin(ph) * sw; ch.RL.hp.rotation.x = -Math.sin(ph) * sw;
  ch.LL.kn.rotation.x = Math.max(0, -Math.sin(ph + 0.9)) * 0.9 * walking;
  ch.RL.kn.rotation.x = Math.max(0, Math.sin(ph + 0.9)) * 0.9 * walking;
  ch.hips.position.y = 0.95 + Math.abs(Math.cos(ph)) * 0.035 * walking;
  const armSw = 0.4 * walking;
  ch.L.sh.rotation.set(-Math.sin(ph) * armSw, 0, 0.06); ch.R.sh.rotation.set(Math.sin(ph) * armSw, 0, -0.06);
  ch.L.el.rotation.x = -0.15; ch.R.el.rotation.x = -0.15;
  const hold = ch.spec.pose || {};
  if (hold.leftHandInPocket) { ch.L.sh.rotation.set(0.05, 0, 0.18); ch.L.el.rotation.x = -0.35; }
  if (ch.bag) { const side = ch.spec.bag.hand === 'left' ? ch.L : ch.R; side.sh.rotation.x *= 0.5; side.el.rotation.x = 0; ch.bag.rotation.x = Math.sin(ph - 0.6) * 0.18 * walking; }
  // gestures: [{t0,t1,type}]
  for (const g of ch.spec.gestures || []) {
    if (t < g.t0 || t > g.t1) continue;
    const u = (t - g.t0) / (g.t1 - g.t0), bell = Math.sin(u * Math.PI);
    const arm = g.hand === 'left' ? ch.L : ch.R;
    if (g.type === 'throw') { arm.sh.rotation.x = lerp(-2.6, -0.4, ease.outCubic(u)); arm.el.rotation.x = lerp(-1.4, 0, u); }
    if (g.type === 'adjustGlasses') { arm.sh.rotation.x = -2.2 * bell; arm.sh.rotation.z = -0.5 * bell * (g.hand === 'left' ? -1 : 1); arm.el.rotation.x = -1.9 * bell; }
    if (g.type === 'wave' || g.type === 'ok') { arm.sh.rotation.x = -1.6 * bell; arm.el.rotation.x = -1.4 * bell; }
  }
  ch.headP.rotation.y = THREE.MathUtils.degToRad(s.headYaw || 0);
  ch.headP.rotation.x = THREE.MathUtils.degToRad(s.headPitch || 0);
}

// ---------- props (e.g. flying sunglasses) ----------
function makeProp(p) {
  const g = new THREE.Group(); scene.add(g);
  if (p.kind === 'sunglasses') {
    const c = p.color || '#ff7aa8';
    box(0.32, 0.07, 0.03, c, g, 0, 0, 0); box(0.02, 0.03, 0.22, c, g, -0.16, 0.01, -0.11); box(0.02, 0.03, 0.22, c, g, 0.16, 0.01, -0.11);
  } else box(...(p.size || [0.2, 0.2, 0.2]), p.color || '#ccc', g);
  return { spec: p, g };
}
const world = new THREE.Vector3();
function anchorPos(ref, out) {
  // "woman.head" | "man.handR" | [x,y,z]
  if (Array.isArray(ref)) return out.set(...ref);
  const [cid, part] = ref.split('.');
  if (cid === 'prop') { const pr = props.find(p => p.spec.id === part); pr.g.updateWorldMatrix(true, false); return pr.g.getWorldPosition(out); }
  const ch = chars[cid]; const node = ch.anchors[part || 'hips'];
  node.updateWorldMatrix(true, false); node.getWorldPosition(out);
  if ((part || 'hips') === 'head') out.y += 0.19 * ch.root.children[0].scale.y;
  return out;
}
function poseProp(pr, t) {
  const s = sample(pr.spec.path, t, ['spin']);
  // each kf: {t, at: anchorRef | [x,y,z], offset:[..], spin:deg}
  const a = s._a || s, b = s;
  const pa = anchorPos(a.at, new THREE.Vector3()).add(new THREE.Vector3(...(a.offset || [0, 0, 0])));
  const pb = anchorPos(b.at, new THREE.Vector3()).add(new THREE.Vector3(...(b.offset || [0, 0, 0])));
  const u = s._u ?? 1;
  pr.g.position.lerpVectors(pa, pb, u);
  if (b.arc && s._u !== undefined) pr.g.position.y += Math.sin(u * Math.PI) * b.arc;
  const sp = THREE.MathUtils.degToRad(s.spin || 0);
  pr.g.rotation.set(Math.sin(sp) * 0.3, sp, Math.sin(sp * 0.5) * 0.5);
  if (b.attach && (u >= 0.999 || a.attach)) { pr.g.rotation.set(0, chars[b.at.split('.')[0]].root.rotation.y, 0); }
}

// ---------- camera (motion-control rig) ----------
const camera = new THREE.PerspectiveCamera(35, W / H, 0.05, 200);
function poseCamera(t) {
  // kf: {t, target:"woman.head"|[x,y,z], dist, az(deg, 0 = in front of subject facing +z), el(deg), fov, lookOffset:[..], ease, cut}
  const s = sample(SPEC.camera, t, ['dist', 'az', 'el', 'fov', 'lookOffset', 'targetOffset']);
  const tgt = anchorPos(s.target, new THREE.Vector3());
  if (s._a && s._a.target !== s.target && !SPEC.camera.find(k => k === s)?.cut) {
    const ta = anchorPos(s._a.target, new THREE.Vector3()); tgt.lerpVectors(ta, tgt, s._u);
  }
  if (s.targetOffset) tgt.add(new THREE.Vector3(...s.targetOffset));
  const az = THREE.MathUtils.degToRad(s.az || 0), el = THREE.MathUtils.degToRad(s.el || 0);
  camera.position.set(tgt.x + Math.sin(az) * Math.cos(el) * s.dist, tgt.y + Math.sin(el) * s.dist, tgt.z + Math.cos(az) * Math.cos(el) * s.dist);
  const look = tgt.clone(); if (s.lookOffset) look.add(new THREE.Vector3(...s.lookOffset));
  camera.lookAt(look);
  camera.fov = s.fov || 35; camera.updateProjectionMatrix();
}

const chars = {};
for (const c of SPEC.characters || []) chars[c.id] = makeCharacter(c);
const props = [];
for (const p of SPEC.props || []) props.push(makeProp(p));

window.__render = t => {
  for (const ch of Object.values(chars)) poseCharacter(ch, t);
  for (const pr of props) poseProp(pr, t);
  scene.updateMatrixWorld(true);
  poseCamera(t);
  renderer.render(scene, camera);
  return true;
};
window.__spec = { duration: SPEC.duration, fps: SPEC.fps || 24, width: W, height: H };
window.__render(0);
window.__ready = true;
// live preview when opened directly in a browser
if (!params.has('capture')) { const t0 = performance.now(); const loop = () => { window.__render(((performance.now() - t0) / 1000) % SPEC.duration); requestAnimationFrame(loop); }; loop(); }
</script>
</body>
</html>
